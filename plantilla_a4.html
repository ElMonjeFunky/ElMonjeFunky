<title>Escandallo semanal melón 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: documento A4 vertical. Portada con resumen y calendario de 53 semanas -> una sección por semana
   (cabecera con totales e indicadores, bloque por tipo con tabla variedad -> fincas). Un solo aspecto claro, pensado para papel. */
:root {
  color-scheme: light;
  --paper: #ffffff; --desk: #e9ebe4; --ink: #1c221b; --muted: #677062; --line: #d9ded1; --soft: #f3f5ef;
  --rind: #2e5935; --rind-soft: #e6eedf; --flesh: #c0601b; --flesh-soft: #fbe9d8; --up: #2e7d4f; --down: #b5482c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@page { size: A4; margin: 12mm 11mm 14mm;
  @bottom-left { content: "Escandallo semanal de melón 2026"; font: 7.5pt "Source Sans 3", sans-serif; color: #677062; }
  @bottom-right { content: "Página " counter(page) " de " counter(pages); font: 7.5pt "Source Sans 3", sans-serif; color: #677062; } }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html { background: var(--desk); }
body { background: var(--desk); color: var(--ink); font: 9pt/1.4 var(--body); margin: 0; }
.doc { display: grid; gap: 16px; padding-block: 24px; padding-inline: 16px; justify-items: center; }
.doc > section { background: var(--paper); width: 100%; max-width: 210mm; padding: 12mm 11mm; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
@media print {
  html, body { background: var(--paper); }
  .doc { display: block; padding: 0; }
  .doc > section { max-width: none; padding: 0; box-shadow: none; }
  .semana, .vacias, .portada { break-before: page; }
  .vacias + .semana { break-before: auto; }
  .portada { break-before: auto; }
}
.muted { color: var(--muted); font-weight: 400; }
.n { text-align: right; font-variant-numeric: tabular-nums; }

/* Portada */
.eyebrow { font: 500 7.5pt var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 30pt/1 var(--display); color: var(--rind); margin: 6px 0 8px; letter-spacing: -.01em; }
.lead { margin: 0 0 12px; color: var(--muted); max-width: 120mm; font-size: 9.5pt; }
.resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 14px; }
.resumen div { background: var(--soft); padding: 6px 9px; }
.resumen dt, .counts dt { font: 500 6.5pt var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.resumen dd { margin: 0; font: 700 14pt var(--display); font-variant-numeric: tabular-nums; }
.resumen dd small { font: 400 7.5pt var(--mono); color: var(--muted); margin-left: 5px; }
.cal-t { font: 500 12pt var(--display); margin: 0 0 6px; }
.cal-t small, .vacias h2 small { font: 400 7.5pt var(--mono); color: var(--muted); margin-left: 6px; }
.cal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.wk { display: grid; gap: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; text-decoration: none; color: var(--ink); background: var(--rind-soft); line-height: 1.25; }
.wk b { font: 700 9.5pt var(--display); color: var(--rind); }
.wk span { font-size: 7pt; font-weight: 600; }
.wk em, .wk i { font: 400 6.5pt var(--mono); font-style: normal; color: var(--muted); }
.wk i { color: var(--ink); }
.wk.off { background: var(--paper); border-style: dashed; }
.wk.off b { color: var(--muted); }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0; font: 500 7pt var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.leyenda span { display: inline-flex; gap: 4px; align-items: center; }
.leyenda i { width: 8px; height: 8px; border-radius: 50%; }
.notas { border-top: 1px solid var(--line); padding-top: 6px; display: grid; gap: 3px; font-size: 7.5pt; color: var(--muted); }
.notas p { margin: 0; }
.notas b { color: var(--ink); }

/* Tramos sin datos */
.vacias h2 { font: 600 13pt var(--display); color: var(--muted); margin: 0 0 6px; }
.vacias { margin-bottom: 4mm; }
.vacias ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.vacias li { border: 1px dashed var(--line); border-radius: 4px; padding: 3px 6px; font-size: 7pt; display: grid; }
.vacias li b { font: 700 9pt var(--display); color: var(--muted); }

/* Semana */
.sem-head { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: end; background: var(--rind-soft); border-radius: 8px; padding: 9px 11px; margin-bottom: 6px; }
.sem-id { display: flex; gap: 10px; align-items: baseline; }
.sem-n { font: 800 28pt/0.9 var(--display); color: var(--rind); }
.sem-r { font: 700 11pt var(--body); }
.sem-r small { display: block; font: 400 7pt var(--mono); color: var(--muted); }
.counts { display: flex; gap: 14px; margin: 0; grid-column: 1; }
.counts dd { margin: 0; font: 700 12pt var(--display); font-variant-numeric: tabular-nums; }
.kpis { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
.kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 44mm; display: grid; gap: 2px; align-content: start; }
.kpi .lab { font: 500 6.5pt var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.kpi .big { font: 800 17pt/1 var(--display); font-variant-numeric: tabular-nums; }
.kpi .big small { font: 400 7.5pt var(--mono); color: var(--muted); margin-left: 4px; }
.kpi.fz .big { color: var(--rind); } .kpi.az .big { color: var(--flesh); }
.delta { font: 500 7pt var(--mono); } .delta.up { color: var(--up); } .delta.down { color: var(--down); }
.tag { font: 500 6pt var(--mono); text-transform: uppercase; padding: 0 4px; border-radius: 3px; background: var(--flesh-soft); color: var(--flesh); letter-spacing: .04em; }
.bandas { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; font: 500 7.5pt var(--mono); }
.bandas em { display: block; font-style: normal; font-size: 6pt; color: var(--muted); }

/* Bloque por tipo */
.tipo { margin-top: 8px; }
.tipo h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0; padding: 3px 0; border-bottom: 1.5pt solid var(--c); font: 600 9pt var(--mono); letter-spacing: .06em; text-transform: uppercase; break-after: avoid; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: inline-block; align-self: center; }
.tipo h3 .sub { font: 400 7pt var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
.tipo h3 .sub b { color: var(--ink); font-weight: 500; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 7.5pt; }
col.c-var { width: 27%; } col.c-n { width: 5.4%; } col.c-mm { width: 8.6%; } col.c-bar { width: 8.6%; } col.c-b { width: 5.2%; }
thead { display: table-header-group; }
th { font: 500 6pt var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 3px 3px 2px; white-space: nowrap; }
th.n { text-align: right; }
tr.grp th { text-align: center; padding-bottom: 0; }
th.g-fz { color: var(--rind); border-bottom: 1px solid var(--line); } th.g-az { color: var(--flesh); border-bottom: 1px solid var(--line); }
td { padding: 2px 3px; vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.n { font-family: var(--mono); font-size: 7pt; }
tbody.grupo { break-inside: avoid; }
tr.var td { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 600; }
tr.var td.n { font-weight: 500; }
tr.var .code { font: 500 6.8pt var(--mono); padding: 0 4px; border-radius: 3px; background: color-mix(in srgb, var(--c) 16%, white); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
tr.finca td { color: var(--muted); font-size: 7pt; padding-top: 1px; padding-bottom: 1px; }
tr.finca td:first-child { padding-left: 14px; }
tr.finca td.n { font-size: 6.6pt; }
tr.finca .cod { font: 400 6pt var(--mono); }
.cat { font: 500 5.8pt var(--mono); border: 1px solid var(--line); border-radius: 2px; padding: 0 3px; }
td.fzv { color: var(--rind); } td.azv { color: var(--flesh); }
tr.finca td.fzv, tr.finca td.azv { color: var(--muted); }
td.mm { color: var(--muted); }
td.b { color: var(--muted); } td.b.hi { color: var(--ink); }
.scale { position: relative; display: inline-block; height: 6px; border-radius: 3px; background: var(--soft); border: 1px solid var(--line); vertical-align: middle; }
.scale .r { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; background: var(--rind); opacity: .32; }
.scale .m { position: absolute; top: -2px; width: 2px; height: 8px; margin-left: -1px; background: var(--rind); border-radius: 1px; }
.kpi .scale { width: 100%; height: 7px; margin: 2px 0; }
tr.finca .scale { opacity: .6; }
</style>
