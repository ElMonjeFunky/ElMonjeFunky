name: Fetch guide images

on:
  push:
    branches: [claude/compassionate-volta-dq2u0k]
    paths: ['.guide/img_urls.txt', '.github/workflows/fetch-guide-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download product photos
        run: |
          mkdir -p .guide/img
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while read -r u; do
            [ -z "$u" ] && continue
            f=".guide/img/$(basename "$u")"
            if curl -fsSL --retry 3 -A "$ua" -H "Accept: image/avif,image/webp,image/*,*/*" -o "$f" "$u"; then
              echo "OK   $(stat -c %s "$f") $f"
            else
              echo "FAIL $u"; rm -f "$f"
            fi
          done < .guide/img_urls.txt
          ls -la .guide/img
      - name: Commit photos to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .guide/img
          git commit -m "Fetch guide product photos" || echo "nothing to commit"
          git push
