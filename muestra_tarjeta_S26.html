<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una tarjeta ancha por semana -> cabecera con totales y dos indicadores (firmeza, azúcar) -> bloque por tipo con tabla de variedades desplegable a fincas */
:root {
  --bg: #f3f4ee; --surface: #fdfdfb; --ink: #1c221b; --muted: #687163; --line: #dce1d4; --empty: #eceee6;
  --rind: #2e5935; --rind-soft: #e3ecdc; --flesh: #c9671f; --flesh-soft: #fbe8d6; --up: #2e7d4f; --down: #b5482c;
  --t-amarillo: #d9a400; --t-cantaloupe: #e07b2a; --t-charentais: #c9572f; --t-galia: #6f9e2b; --t-glv: #2f8a6c;
  --t-ivory: #a39470; --t-orange: #e0614a; --t-sapo: #2f5a36; --t-sunup: #b8862a; --t-otro: #7a8075;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121611; --surface: #1a1f18; --ink: #e6eae1; --muted: #9aa393; --line: #2c3328; --empty: #161a14;
  --rind: #94c58a; --rind-soft: #222d1e; --flesh: #f0a15e; --flesh-soft: #3a2a1c; --up: #7fcf9b; --down: #f08a6e;
  --t-amarillo: #f2c84b; --t-cantaloupe: #f39b56; --t-charentais: #ec8462; --t-galia: #a6cf63; --t-glv: #5fc4a0;
  --t-ivory: #cfc2a0; --t-orange: #f48b77; --t-sapo: #82b57a; --t-sunup: #e0b45c; --t-otro: #a3a99d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121611; --surface: #1a1f18; --ink: #e6eae1; --muted: #9aa393; --line: #2c3328; --empty: #161a14;
  --rind: #94c58a; --rind-soft: #222d1e; --flesh: #f0a15e; --flesh-soft: #3a2a1c; --up: #7fcf9b; --down: #f08a6e;
  --t-amarillo: #f2c84b; --t-cantaloupe: #f39b56; --t-charentais: #ec8462; --t-galia: #a6cf63; --t-glv: #5fc4a0;
  --t-ivory: #cfc2a0; --t-orange: #f48b77; --t-sapo: #82b57a; --t-sunup: #e0b45c; --t-otro: #a3a99d; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; display: grid; gap: 26px; }
header { display: grid; gap: 10px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(28px, 4.6vw, 46px)/1.04 var(--display); color: var(--rind); text-wrap: balance; }
.intro { margin: 0; color: var(--muted); max-width: 72ch; }
.num, td.n { font-variant-numeric: tabular-nums; }

/* Tarjeta */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; scroll-margin-top: 16px; }
.card.vacia { background: var(--empty); border-style: dashed; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; padding: 20px 22px; background: var(--rind-soft); border-bottom: 1px solid var(--line); }
.vacia .head { background: transparent; border: 0; }
.id { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.sem { font: 800 48px/0.9 var(--display); color: var(--rind); }
.vacia .sem { color: var(--muted); font-size: 34px; }
.rango { font: 600 17px var(--body); }
.rango small { display: block; font: 400 12px var(--mono); color: var(--muted); letter-spacing: .03em; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 12px 0 0; }
.counts div { display: grid; }
.counts dt { font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.counts dd { margin: 0; font: 600 20px var(--display); font-variant-numeric: tabular-nums; }
.kpis { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 200px; display: grid; gap: 4px; }
.kpi .lab { font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.kpi .big { font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.kpi .big small { font: 400 13px var(--mono); color: var(--muted); margin-left: 6px; }
.kpi.az .big { color: var(--flesh); }
.kpi.fz .big { color: var(--rind); }
.delta { font: 500 11.5px var(--mono); }
.delta.up { color: var(--up); } .delta.down { color: var(--down); }
.tag { font: 500 10px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--flesh-soft); color: var(--flesh); }
.sin { padding: 0 22px 20px; color: var(--muted); }
@media (max-width: 760px) { .head { grid-template-columns: 1fr; } .sem { font-size: 40px; } }

/* Bloques por tipo */
.body { padding: 6px 22px 22px; display: grid; gap: 22px; }
.tipo-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 14px 0 8px; border-bottom: 2px solid var(--c); }
.tipo-head h3 { margin: 0; font: 600 15px var(--mono); letter-spacing: .07em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.tipo-head .sub { font: 400 12.5px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tipo-head .sub b { color: var(--ink); font-weight: 500; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { text-align: left; font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 6px; white-space: nowrap; }
th.n, td.n { text-align: right; }
td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
td.n { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
tbody.var-row:hover td { background: color-mix(in srgb, var(--c) 6%, var(--surface)); }
.vbtn { all: unset; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.vbtn:focus-visible { outline: 2px solid var(--rind); outline-offset: 2px; border-radius: 4px; }
.vbtn .chev { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); display: grid; place-items: center; font: 500 11px var(--mono); color: var(--muted); transition: transform .15s; }
.vbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.code { font: 500 13px var(--mono); padding: 1px 7px; border-radius: 5px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.vname { display: block; font-size: 12.5px; color: var(--muted); }
tr.finca td { background: var(--bg); font-size: 13px; border-top-color: transparent; }
tr.finca td:first-child { padding-left: 40px; color: var(--muted); }
tr.finca .cat { font: 500 10px var(--mono); padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); margin-left: 6px; }

/* Firmeza: escala 1-5 */
.fz { display: grid; grid-template-columns: 110px auto; gap: 10px; align-items: center; }
.scale { position: relative; height: 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); }
.scale .r { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: var(--rind); opacity: .32; }
.scale .m { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: var(--rind); }
.val { font: 500 13px var(--mono); white-space: nowrap; }
.val small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.az .val { color: var(--ink); }
.kpi .scale { margin-top: 4px; }

footer { color: var(--muted); font-size: 13.5px; max-width: 82ch; border-left: 3px solid var(--flesh); padding-left: 12px; }
@media (prefers-reduced-motion: reduce) { .vbtn .chev { transition: none; } }
</style>

const COLOR = { "AMARILLO": "--t-amarillo", "CANTALOUPE": "--t-cantaloupe", "CHARENTAIS": "--t-charentais",
  "GALIA": "--t-galia", "GALIA LARGA VIDA": "--t-glv", "IVORY GAYA": "--t-ivory", "ORANGE CANDY": "--t-orange",
  "PIEL DE SAPO": "--t-sapo", "SUNUP": "--t-sunup" };
const col = t => `var(${COLOR[t] || "--t-otro"})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = (v, d = 1) => v == null ? "—" : v.toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const dia = dmy => { const [d, m, y] = dmy.split("/").map(Number); return new Date(y, m - 1, d); };
const corto = f => f.toLocaleDateString("es-ES", { day: "numeric", month: "short" }).replace(".", "");
const pos = v => ((Math.min(Math.max(v, 1), 5) - 1) / 4 * 100).toFixed(1) + "%";
const TEMP = DATOS.azucar_temporada ? `<span class="tag" title="El volcado no trae fecha del azúcar: valor de toda la temporada">temporada</span>` : "";

document.getElementById("eyebrow").textContent = `Melón 2026 · ${DATOS.origen}`;
document.getElementById("pie").textContent = DATOS.azucar_temporada
  ? "Azúcar (°Brix): el volcado no trae fecha para el azúcar, así que se muestra la media, mínimo y máximo de toda la temporada de esas fincas y variedad, y el % de muestras con 12 °Brix o más. Con un volcado por semana pasará a ser el azúcar de esa semana."
  : "Azúcar (°Brix) de las muestras de esa semana.";

const escala = f => f ? `<div class="scale" role="img" aria-label="Firmeza de ${n(f[1])} a ${n(f[2])}, media ${n(f[0], 2)}">
  <div class="r" style="left:${pos(f[1])};right:calc(100% - ${pos(f[2])})"></div><div class="m" style="left:${pos(f[0])}"></div></div>` : "";
const fzCell = f => f ? `<div class="fz">${escala(f)}<span class="val">${n(f[0], 2)}<small>${n(f[1])}–${n(f[2])}</small></span></div>` : "—";
const azCell = a => a ? `<span class="val">${n(a[0])}<small>${n(a[1])}–${n(a[2])}</small></span>` : "—";
const pct = p => p == null ? "—" : Math.round(p * 100) + " %";

const cards = document.getElementById("cards");
DATOS.semanas.forEach(s => {
  const ini = dia(s.desde), fin = dia(s.hasta), T = s.total;
  const rango = `<div class="rango">${corto(ini)} – ${corto(fin)}<small>${s.desde} – ${s.hasta}</small></div>`;
  if (!T) {
    cards.insertAdjacentHTML("beforeend", `<article class="card vacia" id="${s.etiqueta}">
      <div class="head"><div class="id"><span class="sem">${s.etiqueta}</span>${rango}</div></div>
      <div class="sin">Sin escandallos esta semana.</div></article>`);
    return;
  }
  let delta = "";
  if (s.firmeza_anterior != null && T.firmeza) {
    const d = T.firmeza[0] - s.firmeza_anterior;
    delta = `<span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${n(Math.abs(d), 2)} vs semana anterior</span>`;
  }
  cards.insertAdjacentHTML("beforeend", `<article class="card" id="${s.etiqueta}">
    <div class="head">
      <div><div class="id"><span class="sem">${s.etiqueta}</span>${rango}</div>
        <dl class="counts">
          <div><dt>Tipos</dt><dd>${s.tipos.length}</dd></div><div><dt>Variedades</dt><dd>${s.variedades}</dd></div>
          <div><dt>Fincas</dt><dd>${T.fincas}</dd></div><div><dt>Albaranes</dt><dd>${T.albaranes}</dd></div>
          <div><dt>Medidas firmeza</dt><dd>${T.medidas.toLocaleString("es-ES")}</dd></div></dl></div>
      <div class="kpis">
        <div class="kpi fz"><div class="lab">Firmeza media (1–5)</div>
          <div class="big">${n(T.firmeza[0], 2)}<small>${n(T.firmeza[1])}–${n(T.firmeza[2])}</small></div>${escala(T.firmeza)}${delta}</div>
        <div class="kpi az"><div class="lab">Azúcar media °Brix ${TEMP}</div>
          <div class="big">${n(T.azucar?.[0])}<small>${T.azucar ? n(T.azucar[1]) + "–" + n(T.azucar[2]) : ""}</small></div>
          <div class="delta" style="color:var(--muted)">${pct(T.mayor12)} de muestras ≥ 12 °Brix</div></div>
      </div>
    </div>
    <div class="body">${s.tipos.map(t => bloqueTipo(s.etiqueta, t)).join("")}</div>
  </article>`);
});

function bloqueTipo(sem, t) {
  const S = t.total;
  return `<section style="--c:${col(t.tipo)}">
    <div class="tipo-head"><h3><span class="dot"></span>${esc(t.tipo)}</h3>
      <div class="sub"><span><b>${t.variedades.length}</b> var.</span><span><b>${S.fincas}</b> fincas</span>
        <span>firmeza <b>${n(S.firmeza[0], 2)}</b> (${n(S.firmeza[1])}–${n(S.firmeza[2])})</span>
        <span>azúcar <b>${n(S.azucar?.[0])}</b>${S.azucar ? ` (${n(S.azucar[1])}–${n(S.azucar[2])})` : ""}</span></div></div>
    <div class="scroll"><table>
      <thead><tr><th>Variedad</th><th class="n">Fincas</th><th class="n">Albaranes</th><th class="n">Medidas</th>
        <th>Firmeza (1–5)</th><th>Azúcar °Brix</th><th class="n">≥ 12 °Brix</th></tr></thead>
      ${t.variedades.map((v, i) => {
        const id = `${sem}-${t.tipo.replace(/\W/g, "")}-${i}`;
        return `<tbody class="var-row"><tr>
          <td><button class="vbtn" type="button" aria-expanded="false" aria-controls="${id}" data-target="${id}">
            <span class="chev">›</span><span><span class="code">${esc(v.codigo)}</span>${v.nombre ? `<span class="vname">${esc(v.nombre)}</span>` : ""}</span></button></td>
          <td class="n">${v.fincas}</td><td class="n">${v.albaranes}</td><td class="n">${v.medidas}</td>
          <td>${fzCell(v.firmeza)}</td><td class="az">${azCell(v.azucar)}</td><td class="n">${pct(v.mayor12)}</td></tr></tbody>
        <tbody id="${id}" hidden>${v.fincas_detalle.map(f => `<tr class="finca">
          <td>${esc(f.finca)} <span style="font-family:var(--mono);font-size:11.5px">${esc(f.cod)}</span>${f.cat ? `<span class="cat">${esc(f.cat)}</span>` : ""}</td>
          <td class="n"></td><td class="n">${f.albaranes}</td><td class="n">${f.medidas}</td>
          <td>${fzCell(f.firmeza)}</td><td class="az">${azCell(f.azucar)}</td><td class="n">${pct(f.mayor12)}</td></tr>`).join("")}</tbody>`;
      }).join("")}
    </table></div></section>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest(".vbtn"); if (!b) return;
  const abierto = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", !abierto);
  document.getElementById(b.dataset.target).hidden = abierto;
});
</script>
